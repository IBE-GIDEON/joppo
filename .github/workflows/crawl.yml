name: Hourly crawl

# The crawl runs here, inside the runner, rather than by calling the app.
#
# It used to POST to /api/cron/ingest. That cannot work on the Cloudflare
# Workers free plan: a Worker gets 10ms of CPU per invocation, and parsing a
# single job board and upserting its listings is far past that, so every call
# came back as error 1102 (exceeded resource limits) after a few seconds.
#
# A GitHub runner is plain Node with no CPU cap, and it talks to Supabase
# directly, so the whole source list can be crawled in one pass. It is free on
# public repositories and well inside the free minutes on private ones.
#
# Requires one repository secret (Settings, Secrets and variables, Actions):
#   DATABASE_URL   the Supabase pooler connection string

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: # runs a crawl on demand from the Actions tab

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INGEST_CONCURRENCY: '6'
          INGEST_USER_AGENT: 'JoppoBot/0.1 (+https://joppo.app/bot)'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the DATABASE_URL repository secret."
            exit 1
          fi
          # A slice per run, stalest first. A full pass over every source takes
          # about fifty minutes, so crawling the lot on an hourly trigger would
          # leave runs overlapping almost continuously. Twenty-five sources
          # finishes well inside the hour and covers all of them in three.
          #
          # --stale=7 retires listings a board has stopped returning and purges
          # the ones that have been retired for a week.
          npm run ingest -- --stale=7 --limit=25
